name: Deploy to GitHub Pages

on:
push:
branches: [main]

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: “pages”
cancel-in-progress: true

jobs:
build-and-deploy:
runs-on: ubuntu-latest
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:
- uses: actions/checkout@v4

```
  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Fix Button location
    run: |
      if [ -f Button.tsx ] && [ -f components/ui/Button.tsx ]; then
        rm Button.tsx
      elif [ -f Button.tsx ]; then
        mkdir -p components/ui
        mv Button.tsx components/ui/Button.tsx
      fi

  - name: Fix importmap and config
    run: |
      python3 -c "
      import re, json
      html = open('index.html').read()
      html = re.sub(r'\s*<script type=\"importmap\">.*?</script>', '', html, flags=re.DOTALL)
      open('index.html', 'w').write(html)
      content = open('vite.config.ts').read()
      if 'base:' not in content:
          content = content.replace('plugins: [react()],', \"plugins: [react()],\n    base: '/Life-Command-Centre/',\")
          open('vite.config.ts', 'w').write(content)
      m = json.load(open('manifest.json'))
      m['start_url'] = '/Life-Command-Centre/'
      m['scope'] = '/Life-Command-Centre/'
      json.dump(m, open('manifest.json', 'w'), indent=2)
      "

  - name: Replace geminiService.ts with known-good version
    run: echo "" | base64 -d > services/geminiService.ts

  - name: Replace Layout.tsx with known-good version
    run: echo "" | base64 -d > components/Layout.tsx

  - name: Patch Settings.tsx - restore API key input
    run: |
      python3 << 'PYEOF'
      import re

      c = open('pages/Settings.tsx').read()

      # 1. Remove the AI Usage Indicator block using brace counting
      marker = '{/* AI Usage Indicator */}'
      if marker in c:
          start = c.find(marker)
          line_start = c.rfind('\n', 0, start) + 1
          i = c.find('{aiUsage && aiConnected && (', start)
          if i != -1:
              brace_depth = 0
              j = i
              end = -1
              while j < len(c):
                  if c[j] == '{': brace_depth += 1
                  elif c[j] == '}':
                      brace_depth -= 1
                      if brace_depth == 0:
                          end = j + 1
                          break
                  j += 1
              if end != -1:
                  if end < len(c) and c[end] == '\n': end += 1
                  c = c[:line_start] + c[end:]

      # 2. Remove aiUsage state and setAiUsage lines
      lines = c.split('\n')
      clean = []
      for line in lines:
          s = line.strip()
          if s.startswith('const [aiUsage'): continue
          if s.startswith('setAiUsage('): continue
          clean.append(line)
      c = '\n'.join(clean)

      # 3. Fix imports
      if 'clearAiInstance' not in c:
          c = re.sub(
              r"import \{([^}]*)\} from '../services/geminiService';",
              "import { isAiReady, clearAiInstance, parseMealLog } from '../services/geminiService';", c)

      # 4. Add apiKeyInput state
      if 'apiKeyInput' not in c:
          c = c.replace(
              'const [aiConnected, setAiConnected] = useState(isAiReady());',
              "const [aiConnected, setAiConnected] = useState(isAiReady());\n  const [apiKeyInput, setApiKeyInput] = useState(localStorage.getItem('gemini_api_key') || '');")

      # 5. Replace AI ENGINE CONFIG card if it has process.env
      if 'process.env.API_KEY' in c and 'SAVE API KEY' not in c:
          si = c.find('<Card title="AI ENGINE CONFIG">')
          if si != -1:
              ei = c.find('</Card>', si)
              if ei != -1:
                  ei += len('</Card>')
                  card = """<Card title="AI ENGINE CONFIG">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-3">
                <Sparkles size={18} className={aiConnected ? 'text-accent' : 'text-alert'} />
                <span className="text-xs font-bold uppercase tracking-tight">Status: {aiConnected ? 'Connected' : 'API Key Missing'}</span>
              </div>
              {aiConnected && <CheckCircle2 size={16} className="text-accent" />}
            </div>
            <Input label="Gemini API Key" type="password" value={apiKeyInput} onChange={(e) => setApiKeyInput(e.target.value)} placeholder="Paste key from ai.google.dev" />
            <Button variant="primary" fullWidth onClick={() => {
              if (apiKeyInput.length < 10) return;
              localStorage.setItem('gemini_api_key', apiKeyInput);
              clearAiInstance();
              alert('API Key saved!');
              window.location.reload();
            }} className="mt-3">SAVE API KEY</Button>
            <Button variant="secondary" fullWidth onClick={async () => {
              try {
                const result = await parseMealLog("1 banana");
                if (result) { alert('Working! ' + result.name + ', ' + result.calories + ' cal'); }
                else { alert('API returned empty.'); }
              } catch (error) { alert('Error: ' + error.message); }
            }} disabled={!aiConnected} className="mt-2">TEST CONNECTION</Button>
        </Card>"""
                  c = c[:si] + card + c[ei:]

      open('pages/Settings.tsx', 'w').write(c)
      print("Settings.tsx patched")
      PYEOF

  - name: Build
    run: npm run build

  - name: Setup Pages
    uses: actions/configure-pages@v4

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: dist

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
```
